<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picsum Photo Cards - TypeScript</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="badge-ts">TypeScript</div>
    <h1>Photo Gallery</h1>
    <p>Photo cards dynamically fetched and rendered with TypeScript & Picsum API</p>
  </header>

  <main>
    <p id="message" class="message" aria-live="polite">Loading photos...</p>
    <section id="photo-container" class="photo-container" aria-label="Photo gallery"></section>
  </main>
</body>
</html>
